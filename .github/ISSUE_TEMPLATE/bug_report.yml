name: Bug report
description: Report a problem with DoneBell
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing DoneBell Public Beta. Please do not include private AI conversation text. If possible, attach or paste the DoneBell diagnostics report — it is the fastest way to identify site-specific detector failures.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site
      description: Example: ChatGPT, Claude, Gemini, DeepSeek, Grok, Perplexity, Microsoft Copilot, Poe, Le Chat/Mistral, or another website.
      placeholder: Gemini
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: DoneBell version
      description: Shown in the DoneBell popup header and included in Diagnostics.
      placeholder: 0.5.18
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Microsoft Edge
        - Google Chrome
        - Other Chromium browser
        - Other
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A short sequence that makes the problem happen again, if known.
      placeholder: |
        1. Open ...
        2. Enable ...
        3. Start ...
        4. Switch tabs ...
        5. Observe ...
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: DoneBell diagnostics
      description: In DoneBell, use Diagnostics / Report a problem and paste the generated report here. Reports are prepared locally and are designed not to include AI prompts or answers.
      render: text
    validations:
      required: false
