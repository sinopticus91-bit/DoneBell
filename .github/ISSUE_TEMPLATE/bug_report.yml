name: Bug report
description: Report a problem with DoneBell
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing DoneBell Public Beta. Please do not include private AI conversation text.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site
      description: Example: ChatGPT, Claude, Gemini, DeepSeek, or another website.
      placeholder: ChatGPT
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Microsoft Edge
        - Google Chrome
        - Other Chromium browser
        - Other
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A short sequence that makes the problem happen again, if known.
      placeholder: |
        1. Open ...
        2. Enable ...
        3. Start ...
        4. Observe ...
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: DoneBell diagnostics
      description: In DoneBell, click “Report a problem” or copy Diagnostics and paste the report here. It is designed not to include AI prompts or answers.
      render: text
    validations:
      required: false
