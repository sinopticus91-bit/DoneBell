name: Release v0.5.36 source sync

on:
  push:
    branches: [main]
    paths:
      - '.release_payload/**'
      - '.github/workflows/release-v0536-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify release patch
        shell: bash
        run: |
          cat .release_payload/patch.b64.part* | base64 -d | gzip -d > /tmp/donebell-v0536.patch
          echo "831d59a6997b23fc09aded99c50b1a05b53ac8cce806163dfc8fe2086b844c7d  /tmp/donebell-v0536.patch" | sha256sum -c -
          git apply --check /tmp/donebell-v0536.patch
          git apply /tmp/donebell-v0536.patch

      - name: Validate extension source
        shell: bash
        run: |
          test "$(node -p "require('./extension/manifest.json').version")" = "0.5.36"
          find extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit public release source
        shell: bash
        run: |
          rm -rf .release_payload
          rm -f .github/workflows/release-v0536-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release DoneBell v0.5.36 full player and reliability update"
          git push
